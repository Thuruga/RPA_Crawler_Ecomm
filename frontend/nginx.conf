server {
    listen 80;
    server_name localhost;
    # A extensão envia uma imagem por requisição. O teto cobre o limite de
    # 12 MB do asset mais a expansão base64, sem aceitar pacotes ilimitados.
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS embutido do Docker. Com um proxy_pass literal, o nginx resolve
    # `backend` na carga da config e SE RECUSA A SUBIR quando o container do
    # backend ainda nao existe -- e morre junto num restart dele. Resolvendo
    # via variavel, a resolucao vai para o tempo do request: o frontend sobe
    # sozinho e volta a funcionar quando o backend reaparece.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_backend "http://backend:8080";

    # ------------------------------------------------------------------
    # API -> backend
    #
    # A API nao tem prefixo /api: as rotas moram na raiz (/monitors,
    # /monitor/..., /search/...). A lista abaixo espelha exatamente o proxy
    # de desenvolvimento em vite.config.ts -- inclusive o detalhe de
    # `monitor/` exigir a barra: `/monitor` sem barra e a pagina do SPA,
    # enquanto `/monitor/categories` e a API. Ao mexer em uma das duas
    # listas, mexa na outra.
    # ------------------------------------------------------------------

    # WebSocket antes do restante: precisa dos headers de upgrade, e em
    # nginx a primeira regex que casa vence.
    # `$http_host` e nao `$host`: $host descarta a porta, e o FastAPI monta o
    # Location dos redirects de barra (`/brands` -> `/brands/`) a partir do Host
    # recebido. Com $host o redirect sai como http://127.0.0.1/brands/ -- porta 80
    # -- e o browser, que chegou pela 5173, se perde.
    location ~ ^/ws/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(brands(/|$)|banners/|map-rules(/|$)|search(/|$)|history(/|$)|monitor/|monitors(/|$)|scrape-category(-multi)?(/|$)|canonical-categories(/|$)|download-report/|system/) {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Varredura de categoria e scrape ao vivo levam minutos; o default
        # de 60s cortaria a resposta no meio.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Precos e status mudam a cada ciclo: resposta de API nunca fica
        # em cache do browser.
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------
    # Estaticos -- o cache que vive no container do frontend
    # ------------------------------------------------------------------

    # O Vite emite nomes com hash de conteudo em /assets, entao o conteudo
    # de um nome dado nunca muda: cache longo e imutavel, sem revalidacao.
    location /assets/ {
        try_files $uri =404;
        # Sem a diretiva `expires`: ela emite o seu proprio Cache-Control e o
        # response sairia com dois headers Cache-Control conflitantes. Este
        # add_header ja cobre o caso e ainda inclui `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA. O index.html NUNCA pode ser cacheado: e ele que aponta para os
    # nomes hasheados novos depois de um deploy -- se ficar preso no cache,
    # o browser segue pedindo assets que nao existem mais.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
