<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40" fill="none">
  <defs>
    <linearGradient id="logoEmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(0, 0)">
    <rect width="40" height="40" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="20" cy="20" r="9" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4.5" fill="url(#logoEmGrad)" filter="url(#logoGlow)"/>
    <path d="M20 20 L30 14" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="50" y="26" fill="#F8FAFC" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em">OmniPulse</text>
  <rect x="168" y="11" width="46" height="20" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="177" y="25" fill="#34D399" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">RPA</text>
</svg>